name: Blackcart
description: >-
  Blackcart is a Try Before You Buy (TBYB) platform for ecommerce merchants that
  lets online shoppers order products, receive them at home, and pay only for
  what they keep during a trial window. The platform pairs a proprietary fraud
  and AI order-decisioning engine with storefront integrations for Shopify,
  Magento, WooCommerce, BigCommerce, Salesforce Commerce Cloud, WordPress, and
  custom storefronts, and charges merchants a revenue share on kept items rather
  than upfront or integration fees. Founded circa 2019 and backed by a 2021
  US$8.8M Series A (investors include 500 Global), Blackcart exposed a Beta REST
  API (order cancellation, refunds, product/store endpoints) documented on
  Stoplight. As of this enrichment pass its primary domains (blackcart.com and
  its *.blackcart.com subdomains) return Fastly "unknown domain" errors and
  blackcart.co serves only a JavaScript redirect shell, indicating the public
  product and developer surface is offline or the company has wound down.
